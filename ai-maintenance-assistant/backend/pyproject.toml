[project]
name = "ai-maintenance-assistant-backend"
version = "0.1.0"
description = "Resumable local-first maintenance request backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4.0",
  "pydantic-ai-slim[openai]>=1.107,<2.0",
  "langchain-core>=1.4,<2.0",
  "langchain-text-splitters>=1.1,<2.0",
  "httpx>=0.28,<1.0",
  "numpy>=2.1,<3.0",
  "sentence-transformers>=5.0,<6.0",
  "faiss-cpu>=1.11,<2.0"
]

[project.optional-dependencies]
local-llm = [
  "torch>=2.8,<3.0",
  "transformers>=5.3,<6.0",
  "accelerate>=1.12,<2.0",
  "huggingface-hub>=1.0,<2.0",
  "safetensors>=0.6,<1.0",
  "bitsandbytes>=0.49,<0.50",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4.21,<7",
]
dev = [
  "pytest>=8.4,<9.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
